<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="14" opacity="0.9" />

  <!-- Inner Circle Grid / Coin Rim -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="10 8" opacity="0.4" />

  <!-- Stylized Coin & Iraqi Dinar / Market Symbol -->
  <!-- Left Coin (IQD) -->
  <circle cx="205" cy="240" r="105" fill="#141824" stroke="url(#goldGrad)" stroke-width="10" />
  <!-- Right Coin (Gold Ounce) -->
  <circle cx="305" cy="240" r="105" fill="#141824" stroke="url(#goldGrad)" stroke-width="10" opacity="0.95" />

  <!-- Center Trend Arrow Up -->
  <path d="M190 320 L245 265 L285 305 L345 220" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M320 220 L345 220 L345 245" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text / Monogram -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#fbbf24" letter-spacing="3">
    بورصة العراق
  </text>
  
  <text x="256" y="455" text-anchor="middle" font-family="monospace, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" letter-spacing="4">
    IRAQ MARKET
  </text>
</svg>
